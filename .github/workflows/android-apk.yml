name: Build Android APK

on:
  push:
    branches: [ccr-377470fe-nxychi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test and build web app
        run: |
          npm test
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Dr-Saleh-Fathullah.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dr-Saleh-Fathullah-APK
          path: Dr-Saleh-Fathullah.apk

      - name: Publish as GitHub release (direct download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saleh-app-v1.0.${{ github.run_number }}
          name: Dr. Saleh Fathullah App 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Android app – Dr. Saleh Fathullah, Orthopedic & Sports Medicine.
            Download **Dr-Saleh-Fathullah.apk** on your phone and open it to install (allow "install unknown apps" when asked).
            Installing a newer version keeps all data on the phone.
          files: Dr-Saleh-Fathullah.apk
